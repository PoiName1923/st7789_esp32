<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desktop Robot</title><link rel="stylesheet" href="/app.css"></head><body>
<main><section id="login"><h1>Desktop Robot</h1><p>Kết nối bảo mật nội bộ</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu quản trị" required><button>Đăng nhập</button></form></section>
<section id="panel" hidden><header><h1>Desktop Robot</h1><span id="network">—</span></header><div class="grid">
<article><h2>Màn hình</h2><div class="buttons"><button data-screen="1">Khuôn mặt</button><button data-screen="2">Thời tiết</button><button data-screen="3">Cảm biến</button></div><label>Animation <select id="animation"><option value="0">Idle</option><option value="2">Happy</option><option value="3">Sleepy</option><option value="4">Surprised</option><option value="5">Look left</option><option value="6">Look right</option></select></label></article>
<article><h2>Trạng thái</h2><dl><dt>Nhiệt độ</dt><dd id="temperature">—</dd><dt>Độ ẩm</dt><dd id="humidity">—</dd><dt>Lỗi gần nhất</dt><dd id="error">Không có</dd></dl></article>
<article><h2>Hiển thị</h2><form id="displayForm"><label>FPS <input name="fps" type="number" min="5" max="50" value="25"></label><label>Màu khuôn mặt <input name="faceColor" type="color" value="#00d9ff"></label><label>Chuyển màn (giây) <input name="screenSwitch" type="number" min="1" value="30"></label><label>Hiện thông tin (giây) <input name="infoDuration" type="number" min="1" value="6"></label><label>Xoay <select name="rotation"><option>0</option><option>90</option><option>180</option><option>270</option></select></label><label><input name="bgr" type="checkbox"> Thứ tự màu BGR</label><label><input name="invert" type="checkbox"> Đảo màu</label><label>Offset X <input name="offsetX" type="number" min="-320" max="320" value="0"></label><label>Offset Y <input name="offsetY" type="number" min="-320" max="320" value="0"></label><p class="note">Đổi hướng/màu/offset cần khởi động lại.</p><label>Độ sáng <input disabled value="Không hỗ trợ: BL nối 3V3"></label><button>Lưu</button></form></article>
<article><h2>Mạng & thời tiết</h2><form id="networkForm"><label>Wi‑Fi nhà <input name="ssid" maxlength="32"></label><label>Mật khẩu Wi‑Fi <input name="wifiPassword" type="password" maxlength="63" placeholder="Để trống để giữ nguyên"></label><label><input name="openNetwork" type="checkbox"> Mạng mở, xóa mật khẩu đã lưu</label><label>Mật khẩu Wi‑Fi dự phòng <input name="apPassword" type="password" minlength="8" maxlength="63" placeholder="Để trống để giữ nguyên"></label><label>Vĩ độ <input name="latitude"></label><label>Kinh độ <input name="longitude"></label><label>Múi giờ <input name="timezone"></label><label>Cập nhật (phút) <input name="weatherInterval" type="number" min="5" max="180" value="15"></label><button>Lưu và kết nối lại</button></form><p class="note">Kết nối có thể ngắt. Nếu lỗi, kết nối lại Wi‑Fi dự phòng của robot.</p></article>
<article><h2>Bảo mật</h2><form id="adminForm"><input name="oldPassword" type="password" placeholder="Mật khẩu hiện tại" required><input name="newPassword" type="password" minlength="10" placeholder="Mật khẩu mới" required><button>Đổi mật khẩu quản trị</button></form></article>
</div><p id="message" role="status"></p></section></main><script src="/app.js"></script></body></html>
